routes:
  posts:
    base: /api/posts
    endpoints:
      list:
        method: GET
        auth: public
        rateLimit:
          windowSize: 60000  # 1 minute
          maxRequests: 100
      create:
        method: POST
        auth: protected
        schema: PostSchema
      getById:
        path: /:id
        method: GET
        auth: public
      update:
        path: /:id
        method: PUT
        auth: protected
        schema: PostSchema
        roles: ['author', 'admin']
      delete:
        path: /:id
        method: DELETE
        auth: protected
        roles: ['author', 'admin']

  comments:
    base: /api/comments
    endpoints:
      list:
        method: GET
        auth: public
        rateLimit:
          windowSize: 60000
          maxRequests: 50
      create:
        method: POST
        auth: protected
        schema: CommentSchema
      delete:
        path: /:id
        method: DELETE
        auth: protected
        roles: ['author', 'admin']

  users:
    base: /api/users
    endpoints:
      profile:
        method: GET
        auth: protected
      update:
        method: PUT
        auth: protected
        schema: UserSchema

errors:
  validation:
    INVALID_REQUEST: 'Invalid request format'
    INVALID_SCHEMA: 'Data validation failed'
  auth:
    UNAUTHORIZED: 'Authentication required'
    FORBIDDEN: 'Insufficient permissions'
  server:
    NOT_FOUND: 'Resource not found'
    INTERNAL_ERROR: 'Internal server error'